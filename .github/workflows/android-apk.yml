name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, polish/foundation-and-security, feature/pesapal-premium-integration]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Ubuntu runners already provide Android SDK command-line tools.
      # setup-android@v3 tries to install the removed legacy 'tools' package.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo 'Android sdkmanager not found'; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        run: npm ci
      - name: Validate public build configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL Actions secret'; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo 'Missing VITE_SUPABASE_ANON_KEY Actions secret'; exit 1; }
      - name: Verify shared Supabase endpoint is reachable
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request
          url = os.environ.get('SUPABASE_URL', '').rstrip('/')
          key = os.environ.get('SUPABASE_ANON_KEY', '')
          if not url.startswith('https://') or not key:
              sys.exit('::error::Missing/invalid VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY')
          print('Web frontend Supabase URL configured:', url)
          req = urllib.request.Request(url + '/auth/v1/settings', headers={'apikey': key, 'Accept': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  body = response.read(4096).decode('utf-8', 'replace')
                  if not 200 <= response.status < 300:
                      sys.exit(f'::error::Supabase Auth health returned HTTP {response.status}')
                  print('Supabase Auth health HTTP', response.status, body[:300])
          except Exception as exc:
              sys.exit(f'::error::Configured Supabase endpoint check failed. HTTP 404 usually means the URL is not a Supabase project API URL; check the VITE_SUPABASE_URL secret (value redacted): {exc}')
          PY
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Verify camera permission is packaged in the native APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | grep -Fq 'android.permission.CAMERA' || { echo '::error::Native APK is missing android.permission.CAMERA'; exit 1; }
          echo 'Verified: CAMERA permission is present in the final Capacitor APK.'
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TikVTVz-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
