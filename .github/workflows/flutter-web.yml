name: Flutter Web build and preview
on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-web.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-web:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=web --project-name tikvtv
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Verify Flutter Web dependencies
        run: flutter pub outdated || true
      - run: flutter build web --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Configure SPA navigation
        run: |
          printf '/* /index.html 200\n' > build/web/_redirects
          test -f build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/main.dart.js
          test -s build/web/flutter_service_worker.js || echo 'Flutter service worker not generated by this SDK; deployment must not assume offline support.'
          cat > build/web/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            X-Frame-Options: DENY
            Permissions-Policy: camera=(self), microphone=(), geolocation=(), payment=()
          /index.html
            Cache-Control: no-cache, max-age=0, must-revalidate
          /flutter_bootstrap.js
            Cache-Control: no-cache, max-age=0, must-revalidate
          /main.dart.js
            Cache-Control: no-cache, max-age=0, must-revalidate
          EOF
          test -s build/web/_headers
          grep -Fq 'Permissions-Policy: camera=(self)' build/web/_headers
          ! grep -Fq 'Permissions-Policy: camera=()' build/web/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: tikvtv-flutter-web
          path: flutter_app/build/web/
      - name: Deploy Flutter Web preview (never production)
        if: github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy flutter_app/build/web --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=flutter-migration-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
