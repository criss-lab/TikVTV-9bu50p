name: Flutter Android TV APK
on:
  push:
    branches: [main, feature/pesapal-premium-integration]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-tv.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-tv.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android runner
        run: flutter create . --platforms=android --project-name tikvtv
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure TV manifest and networking
        run: |
          python3 tool/configure_android.py
          python3 tool/configure_tv.py
      - name: Verify TV manifest does not require camera hardware
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          features = {node.get(ns + 'name'): node.get(ns + 'required') for node in root.findall('uses-feature')}
          for feature in ('android.hardware.camera', 'android.hardware.camera.autofocus'):
              assert features.get(feature) == 'false', f'{feature} must be optional for camera-less TV devices'
          assert features.get('android.software.leanback') == 'true', 'TV launcher must require Leanback'
          print('Verified: Android TV requires Leanback but not camera or autofocus')
          PY
      - name: Configure persistent signing when provisioned
        run: python3 tool/configure_signing.py
      - name: Prepare Android NDK with retry for corrupted SDK downloads
        run: |
          set -euo pipefail
          NDK_VERSION=28.2.13676358
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ -f "$NDK_PATH/source.properties" ] && grep -q "Pkg.Revision = $NDK_VERSION" "$NDK_PATH/source.properties"; then
            echo "Required Android NDK already installed"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            rm -rf "$NDK_PATH" "$ANDROID_HOME/.temp"/*
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" < /dev/null && \
               test -f "$NDK_PATH/source.properties" && \
               grep -q "Pkg.Revision = $NDK_VERSION" "$NDK_PATH/source.properties"; then
              echo "Android NDK verified"
              exit 0
            fi
            rm -rf "$NDK_PATH" "$ANDROID_HOME/.temp"/*
            sleep $((attempt * 8))
          done
          echo "::error::Unable to install verified Android NDK after three attempts"
          exit 1
      - name: Build separate TV APK
        run: flutter build apk --release --target lib/main_tv.dart --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Verify APK signature and package metadata
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            CERT="$("$APKSIGNER" verify --print-certs "$APK")"
            echo "$CERT" | grep -q 'Signer #1 certificate SHA-256 digest:'
          fi
      - name: Verify TV package and artifact
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TikVTV-TV-preview.apk
          sha256sum build/app/outputs/flutter-apk/TikVTV-TV-preview.apk > build/app/outputs/flutter-apk/TV-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TikVTV-TV-preview-${{ github.run_number }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/TikVTV-TV-preview.apk
            flutter_app/build/app/outputs/flutter-apk/TV-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly downloadable rolling TV preview
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view preview-tv-latest >/dev/null 2>&1; then
            gh release create preview-tv-latest --target "$GITHUB_SHA" --title "TikVTV Android TV preview" --notes "Dedicated Flutter Android TV preview. Verify TV-SHA256SUMS.txt. Preview signing may change between runs; not a Play Store production release." --prerelease
          fi
          gh release upload preview-tv-latest build/app/outputs/flutter-apk/TikVTV-TV-preview.apk build/app/outputs/flutter-apk/TV-SHA256SUMS.txt --clobber
