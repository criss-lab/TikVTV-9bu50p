name: Sync payment secrets to Render
on:
  workflow_dispatch:
  push:
    branches: [feature/pesapal-premium-integration]
    paths:
      - 'payment-backend/**'
      - '.github/workflows/sync-pesapal-render.yml'
permissions:
  contents: read
concurrency:
  group: payment-secret-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          RENDER_API_KEY: ${{ secrets.Render_api_secret }}
          PESAPAL_CONSUMER_KEY: ${{ secrets.PESAPAL_CONSUMER_KEY }}
          PESAPAL_CONSUMER_SECRET: ${{ secrets.PESAPAL_CONSUMER_SECRET }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo 'Missing Render_api_secret'; exit 1; }
          test -n "$PESAPAL_CONSUMER_KEY" || { echo 'Missing PESAPAL_CONSUMER_KEY'; exit 1; }
          test -n "$PESAPAL_CONSUMER_SECRET" || { echo 'Missing PESAPAL_CONSUMER_SECRET'; exit 1; }
          test -n "$NEON_DATABASE_URL" || { echo 'Missing NEON_DATABASE_URL'; exit 1; }
          test -n "$SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL for bearer-token validation'; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo 'Missing VITE_SUPABASE_ANON_KEY for bearer-token validation'; exit 1; }
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply and verify Neon payment schema
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          cd payment-backend
          npm install --no-package-lock --no-audit --no-fund
          DATABASE_URL="$NEON_DATABASE_URL" npm run migrate
      - name: Merge environment variables into Render without printing secrets
        env:
          RENDER_API_KEY: ${{ secrets.Render_api_secret }}
          PESAPAL_CONSUMER_KEY: ${{ secrets.PESAPAL_CONSUMER_KEY }}
          PESAPAL_CONSUMER_SECRET: ${{ secrets.PESAPAL_CONSUMER_SECRET }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          base='https://api.render.com/v1/services/srv-dbc9m8g473hc73fi9vl0/env-vars'
          headers={'Authorization':'Bearer '+os.environ['RENDER_API_KEY'],'Accept':'application/json'}
          def request(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              h=dict(headers)
              if data is not None: h['Content-Type']='application/json'
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=30) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None
          existing=[]; cursor=None
          while True:
              url=base+('?cursor='+urllib.parse.quote(cursor) if cursor else '')
              page=request('GET',url) or []
              existing.extend(page)
              cursor=page[-1].get('cursor') if page else None
              if not cursor: break
          values={}
          for item in existing:
              env=item.get('envVar',item)
              key=env.get('key'); value=env.get('value')
              if key and value is not None:
                  if value in ('********','••••••••'): raise SystemExit('Render masked an existing variable; refusing unsafe replacement.')
                  values[key]=value
          values.update({
            'PESAPAL_CONSUMER_KEY':os.environ['PESAPAL_CONSUMER_KEY'],
            'PESAPAL_CONSUMER_SECRET':os.environ['PESAPAL_CONSUMER_SECRET'],
            'PESAPAL_IPN_ID':'14314610-0182-4a20-858a-d9c21fd81890',
            'DATABASE_URL':os.environ['NEON_DATABASE_URL'],
            'PESAPAL_ENVIRONMENT':'live',
            'APP_URL':'https://streamora.co.ke',
            'CORS_ORIGINS':'https://streamora.co.ke,https://www.streamora.co.ke,http://localhost,https://localhost,capacitor://localhost,ionic://localhost'
          })
          if os.environ.get('SUPABASE_URL'): values['SUPABASE_URL']=os.environ['SUPABASE_URL']
          if os.environ.get('SUPABASE_ANON_KEY'): values['SUPABASE_ANON_KEY']=os.environ['SUPABASE_ANON_KEY']
          request('PUT',base,[{'key':k,'value':v} for k,v in values.items()])
          print('Render payment environment synchronized; values withheld.')
          PY
      - name: Trigger and wait for this Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.Render_api_secret }}
        run: |
          set -euo pipefail
          deploy_response=$(curl --fail --silent --show-error -X POST "https://api.render.com/v1/services/srv-dbc9m8g473hc73fi9vl0/deploys" -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d '{}')
          deploy_id=$(printf '%s' "$deploy_response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')
          test -n "$deploy_id" || { echo 'Render did not return a deployment ID'; exit 1; }
          echo "Waiting for Render deployment $deploy_id to finish."
          for attempt in $(seq 1 60); do
            deploy_status=$(curl --fail --silent --show-error --max-time 15 "https://api.render.com/v1/services/srv-dbc9m8g473hc73fi9vl0/deploys/$deploy_id" -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')
            echo "Render deployment status: $deploy_status"
            if [ "$deploy_status" = "live" ]; then
              echo 'The requested Render deployment is live.'
              exit 0
            fi
            case "$deploy_status" in
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deployment ended unsuccessfully: $deploy_status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo 'Timed out waiting for the requested Render deployment to become live.'
          exit 1
      - name: Verify live payment API readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if body=$(curl --fail --silent --show-error --max-time 10 https://tikvtv-payment-api.onrender.com/pesapal/readiness); then
              echo "$body"
              if echo "$body" | grep -q '"ready":true' && echo "$body" | grep -q '"premium_activation_enabled":true' && echo "$body" | grep -q '"environment":"live"' && echo "$body" | grep -q '"payment_schema":true'; then
                echo 'Payment API readiness verified.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Payment API did not become ready with database, Pesapal, and account validation configured.'
          exit 1
