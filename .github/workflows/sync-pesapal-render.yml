name: Sync Pesapal secrets to Render
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets exist
        env:
          RENDER_API_KEY: ${{ secrets.Render_api_secret }}
          PESAPAL_CONSUMER_KEY: ${{ secrets.PESAPAL_CONSUMER_KEY }}
          PESAPAL_CONSUMER_SECRET: ${{ secrets.PESAPAL_CONSUMER_SECRET }}
        run: |
          test -n "$RENDER_API_KEY" || { echo 'Missing GitHub secret Render_api_secret'; exit 1; }
          test -n "$PESAPAL_CONSUMER_KEY" || { echo 'Missing PESAPAL_CONSUMER_KEY'; exit 1; }
          test -n "$PESAPAL_CONSUMER_SECRET" || { echo 'Missing PESAPAL_CONSUMER_SECRET'; exit 1; }
      - name: Merge Pesapal credentials into Render environment
        env:
          RENDER_API_KEY: ${{ secrets.Render_api_secret }}
          PESAPAL_CONSUMER_KEY: ${{ secrets.PESAPAL_CONSUMER_KEY }}
          PESAPAL_CONSUMER_SECRET: ${{ secrets.PESAPAL_CONSUMER_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          base='https://api.render.com/v1/services/srv-dbc9m8g473hc73fi9vl0/env-vars'
          headers={'Authorization':'Bearer '+os.environ['RENDER_API_KEY'],'Accept':'application/json'}
          def request(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              h=dict(headers)
              if data is not None: h['Content-Type']='application/json'
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=30) as response:
                  return json.load(response)
          existing=[]; cursor=None
          while True:
              url=base+('?cursor='+urllib.parse.quote(cursor) if cursor else '')
              page=request('GET',url)
              existing.extend(page)
              cursor=page[-1].get('cursor') if page else None
              if not cursor: break
          values={entry['envVar']['key']:entry['envVar'].get('value','') for entry in existing}
          values['PESAPAL_CONSUMER_KEY']=os.environ['PESAPAL_CONSUMER_KEY']
          values['PESAPAL_CONSUMER_SECRET']=os.environ['PESAPAL_CONSUMER_SECRET']
          values['PESAPAL_IPN_ID']='14314610-0182-4a20-858a-d9c21fd81890'
          request('PUT',base,[{'key':k,'value':v} for k,v in values.items()])
          print('Render environment synchronization request completed (values withheld).')
          PY
