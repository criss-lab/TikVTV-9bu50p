name: Flutter Android APK
on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android runner
        run: flutter create . --platforms=android --project-name tikvtv
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure Android network access
        run: python3 tool/configure_android.py
      - name: Build Flutter debug APK
        run: flutter build apk --debug
      - name: Verify and label preview APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/TikVTV-preview.apk
          cd build/app/outputs/flutter-apk
          sha256sum TikVTV-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TikVTV-preview-${{ github.run_number }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/TikVTV-preview.apk
            flutter_app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish rolling preview APK on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view preview-latest >/dev/null 2>&1; then
            gh release create preview-latest --target "$GITHUB_SHA" --title "TikVTV latest Android preview" --notes "Automatically updated debug-signed preview APK from main. This is a testing build, not a production release. Verify SHA256SUMS.txt. Signing keys can change between CI runs." --prerelease
          fi
          gh release upload preview-latest build/app/outputs/flutter-apk/TikVTV-preview.apk build/app/outputs/flutter-apk/SHA256SUMS.txt --clobber
      - name: Publish tagged preview download
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/TikVTV-preview.apk \
            build/app/outputs/flutter-apk/SHA256SUMS.txt \
            --title "TikVTV $GITHUB_REF_NAME (preview)" \
            --notes "Preview APK signed with a temporary Android debug key. Test build only: signatures can change between runs, requiring uninstall before reinstall. Verify the checksum. This is not a production release." \
            --prerelease
