name: Flutter Android APK
on:
  push:
    branches: [main, feature/pesapal-premium-integration]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  flutter-android:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android runner
        run: flutter create . --platforms=android --project-name tikvtv
      - name: Install supplied Firebase Android configuration
        run: cp firebase/google-services.json android/app/google-services.json
      - name: Configure Firebase Android runner
        run: python3 tool/configure_firebase.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure Android network access
        run: python3 tool/configure_android.py
      - name: Verify generated Android camera permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          permissions = {node.get(ns + 'name') for node in root.findall('uses-permission')}
          assert 'android.permission.CAMERA' in permissions, 'Camera permission missing from generated runner'
          features = {node.get(ns + 'name'): node.get(ns + 'required') for node in root.findall('uses-feature')}
          assert features.get('android.hardware.camera') == 'false', 'Camera must remain optional for Android TV'
          assert features.get('android.hardware.camera.autofocus') == 'false', 'Autofocus must remain optional for devices without camera hardware'
          print('Generated Android camera permission and optional feature verified')
          PY
      - name: Configure persistent signing when provisioned
        run: python3 tool/configure_signing.py
      - name: Build obfuscated Flutter release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Verify camera permission is packaged in the Flutter release APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(dirname "$APKSIGNER")/aapt"
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | grep -Fq 'android.permission.CAMERA' || { echo '::error::Flutter release APK is missing android.permission.CAMERA'; exit 1; }
          echo 'Verified: CAMERA permission is present in the final Flutter release APK.'
      - name: Scan built APK for malware with ClamAV
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --infected --no-summary "$APK"
          mkdir -p build/security
          unzip -q "$APK" -d build/security/unpacked
          clamscan --recursive --infected --no-summary build/security/unpacked
          echo "ClamAV APK and extracted payload scan completed with no detections"
      - name: Verify APK signature and package metadata
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            CERT="$("$APKSIGNER" verify --print-certs "$APK")"
            echo "$CERT" | grep -q 'Signer #1 certificate SHA-256 digest:'
          fi
      - name: Verify APK archive and Android 12 installation compatibility
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          python3 - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              corrupt = apk.testzip()
              assert corrupt is None, f'Corrupt APK member: {corrupt}'
              names = set(apk.namelist())
              assert 'AndroidManifest.xml' in names, 'Missing binary manifest'
              assert 'classes.dex' in names, 'Missing Android classes'
              assert any(name.startswith('lib/') and name.endswith('/libflutter.so') for name in names), 'Missing Flutter native engine'
              print('APK ZIP integrity and required package entries verified')
          PY
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --min-sdk-version 31 --verbose --print-certs "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)'
      - name: Verify and label preview APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/TikVTV-preview.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          cd build/app/outputs/flutter-apk
          # Validate the exact file that will be published, not only the original build output.
          sha256sum TikVTV-preview.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs TikVTV-preview.apk > SIGNER-DETAILS.txt
          grep -E '^(Signer #1|V2 Signer): certificate SHA-256 digest:' SIGNER-DETAILS.txt > SIGNER-SHA256.txt
          test -s SIGNER-SHA256.txt
          "$AAPT" dump badging TikVTV-preview.apk > APK-BADGING.txt
          grep -q "^package: name='" APK-BADGING.txt
          grep -q "^sdkVersion:'" APK-BADGING.txt
          grep -q "^targetSdkVersion:'" APK-BADGING.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('TikVTV-preview.apk') as apk:
              bad = apk.testzip()
              assert bad is None, f'Published APK has a corrupt ZIP entry: {bad}'
              names = set(apk.namelist())
              assert 'AndroidManifest.xml' in names, 'Published APK has no AndroidManifest.xml'
              assert 'classes.dex' in names, 'Published APK has no classes.dex'
              assert any(n.startswith('lib/') and n.endswith('/libflutter.so') for n in names), 'Published APK lacks Flutter engine'
          with open('APK-METADATA.txt', 'w') as out:
              out.write(open('APK-BADGING.txt').read())
              out.write('\n')
              out.write(open('SIGNER-SHA256.txt').read())
              out.write('\n')
              out.write(open('SHA256SUMS.txt').read())
          print('Published APK passed checksum, signature, metadata and archive checks')
          PY
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s\n' 'PREVIEW ONLY: signed with a temporary CI debug key; not guaranteed to update an installed build.' 'Do not uninstall an existing app solely to install this preview unless its data is backed up.' > INSTALL-NOTICE.txt
          else
            printf '%s\n' 'Persistent signing configured. Updating an existing installation still requires the same application ID and signing certificate.' > INSTALL-NOTICE.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TikVTV-preview-${{ github.run_number }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/TikVTV-preview.apk
            flutter_app/build/app/outputs/flutter-apk/SHA256SUMS.txt
            flutter_app/build/app/outputs/flutter-apk/SIGNER-SHA256.txt
            flutter_app/build/app/outputs/flutter-apk/INSTALL-NOTICE.txt
            flutter_app/build/symbols/**
          if-no-files-found: error
          retention-days: 90
      - name: Publish rolling preview APK on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view preview-latest >/dev/null 2>&1; then
            gh release create preview-latest --target "$GITHUB_SHA" --title "TikVTV latest Android preview" --notes "Automatically updated obfuscated release-mode preview APK from main. This is a testing build signed with the CI debug key, not a production-signing release. Verify SHA256SUMS.txt. Signing keys can change between CI runs." --prerelease
          fi
          # GitHub Releases can transiently return HTTP 5xx during asset replacement.\n          # Repeating --clobber is idempotent for the same verified APK and metadata.\n          for attempt in 1 2 3 4 5; do\n            if gh release upload preview-latest build/app/outputs/flutter-apk/TikVTV-preview.apk build/app/outputs/flutter-apk/SHA256SUMS.txt build/app/outputs/flutter-apk/SIGNER-SHA256.txt build/app/outputs/flutter-apk/APK-METADATA.txt build/app/outputs/flutter-apk/APK-BADGING.txt build/app/outputs/flutter-apk/INSTALL-NOTICE.txt --clobber; then\n              break\n            fi\n            if [ "$attempt" -eq 5 ]; then echo "::error::Release upload failed after five attempts"; exit 1; fi\n            sleep $((attempt * 10))\n          done\n          gh release download preview-latest --pattern SHA256SUMS.txt --dir /tmp/tikvtv-release-check --clobber\n          cmp build/app/outputs/flutter-apk/SHA256SUMS.txt /tmp/tikvtv-release-check/SHA256SUMS.txt
          gh release edit preview-latest --target "$GITHUB_SHA" --notes "Preview built from commit $GITHUB_SHA. Download the APK asset directly, not the source-code ZIP. CI debug-key signing is not stable across builds unless persistent signing secrets are configured."
      - name: Publish tagged preview download
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/TikVTV-preview.apk \
            build/app/outputs/flutter-apk/SHA256SUMS.txt \
            --title "TikVTV $GITHUB_REF_NAME (preview)" \
            --notes "Obfuscated Flutter release-mode preview APK signed with the temporary CI debug key. Test build only: signatures can change between runs, requiring uninstall before reinstall. Verify the checksum. This is not a production-signing release." \
            --prerelease
