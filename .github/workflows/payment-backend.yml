name: Payment backend quality
on:
  push:
    branches: [main, feature/pesapal-premium-integration]
    paths:
      - 'payment-backend/**'
      - '.github/workflows/payment-backend.yml'
  pull_request:
    branches: [main, feature/pesapal-premium-integration]
    paths:
      - 'payment-backend/**'
      - '.github/workflows/payment-backend.yml'
permissions:
  contents: read
concurrency:
  group: payment-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payment-backend/package.json
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Check backend syntax
        run: |
          node --check server.js
          node --check migrate.js
          node --check plans.js
      - name: Run payment plan regression tests
        run: npm test
