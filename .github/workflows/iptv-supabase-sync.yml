name: Supabase IPTV catalogue sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iptv-supabase-sync.yml'
      - 'payment-backend/sync-iptv-catalogue.js'
      - 'payment-backend/package.json'
      - 'payment-backend/verify-iptv.mjs'
      - 'payment-backend/iptv-playback.mjs'
      - 'payment-backend/iptv-safe-probe.mjs'
      - 'payment-backend/iptv-manifest.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: iptv-supabase-catalogue-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: payment-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate secure database configuration
        env:
          IPTV_DATABASE_URL: ${{ secrets.IPTV_DATABASE_URL }}
          IPTV_CA_CERT: ${{ secrets.IPTV_CA_CERT }}
        run: |
          if [ -z "$IPTV_DATABASE_URL" ]; then
            echo "::error::Configure IPTV_DATABASE_URL as a GitHub Actions secret with the Infinity IPTV database connection string."
            exit 1
          fi
          if [ -z "$IPTV_CA_CERT" ]; then
            echo "::error::Configure existing IPTV_CA_CERT repository secret with the database CA PEM."
            exit 1
          fi
          echo "IPTV database URL and trusted CA are configured."
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Validate importer syntax
        run: |
          node --check sync-iptv-catalogue.js
          node --check verify-iptv.mjs
      - name: Sync unreviewed source discoveries into isolated IPTV schema
        env:
          IPTV_DATABASE_URL: ${{ secrets.IPTV_DATABASE_URL }}
          IPTV_CA_CERT: ${{ secrets.IPTV_CA_CERT }}
        run: node sync-iptv-catalogue.js
      - name: Bounded verification of discovered streams
        env:
          IPTV_DATABASE_URL: ${{ secrets.IPTV_DATABASE_URL }}
          IPTV_CA_CERT: ${{ secrets.IPTV_CA_CERT }}
          IPTV_VERIFY_BATCH: '50'
        run: node verify-iptv.mjs
