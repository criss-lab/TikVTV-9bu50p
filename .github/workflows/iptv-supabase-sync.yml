name: Supabase IPTV catalogue sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iptv-supabase-sync.yml'
      - 'payment-backend/sync-iptv-catalogue.js'
      - 'payment-backend/package.json'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: iptv-supabase-catalogue-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: payment-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate secure database configuration
        env:
          INFINITY_IPTV_DATABASE_URL: ${{ secrets.INFINITY_IPTV_DATABASE_URL }}
          INFINITY_IPTV_CA_CERT: ${{ secrets.INFINITY_IPTV_CA_CERT }}
        run: |
          if [ -z "$INFINITY_IPTV_DATABASE_URL" ]; then
            echo "::error::Configure INFINITY_IPTV_DATABASE_URL as a GitHub Actions secret with the Infinity IPTV database connection string."
            exit 1
          fi
          if [ -z "$INFINITY_IPTV_CA_CERT" ]; then
            echo "::error::Configure INFINITY_IPTV_CA_CERT with the trusted Supabase database CA certificate."
            exit 1
          fi
          echo "Infinity IPTV database URL and TLS CA secret are present."
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Validate importer syntax
        run: node --check sync-iptv-catalogue.js
      - name: Sync unreviewed source discoveries into isolated IPTV schema
        env:
          INFINITY_IPTV_DATABASE_URL: ${{ secrets.INFINITY_IPTV_DATABASE_URL }}
          INFINITY_IPTV_CA_CERT: ${{ secrets.INFINITY_IPTV_CA_CERT }}
        run: node sync-iptv-catalogue.js
