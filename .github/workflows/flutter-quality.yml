name: Flutter migration quality
on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-quality.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners
        run: flutter create . --platforms=android,web --project-name tikvtv
      - name: Configure Android networking
        run: python3 tool/configure_android.py
      - run: flutter pub get
      - name: Check formatting
        run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tikvtv-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
